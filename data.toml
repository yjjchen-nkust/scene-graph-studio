# devdata entries for this subproject: see spec section 6.2 (Project manifest).
#
# One dataset: data/, the link to the NAS that D110 made, at the machine root `raw`'s
# WekaExt/scene-graph-studio, where decision 4.5 puts project-owned data (D125). Generators write
# through it, and stop when it is absent (rule 10.4). `devdata pull` makes the link, as start.ps1 and
# fetch-data.ps1 do through system/tools/Connect-DataDirectory.ps1; those stay until a second machine
# has passed with devdata alone (spec section 10.1, steps 5 and 6).
[entries.data]
kind    = "dataset"
path    = "data"
source  = "raw:WekaExt/scene-graph-studio"
